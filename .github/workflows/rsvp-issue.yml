name: Process RSVP

# Triggered whenever a new issue is opened with the "rsvp" label
# (the wedding site form does that automatically). The workflow parses
# the issue, appends a row to katilimcilar.csv, then redacts and closes
# the issue so no personal data lives in the public issue history.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Serialize all RSVP writes so two simultaneous submits don't race on the CSV.
concurrency:
  group: rsvp-csv
  cancel-in-progress: false

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'rsvp')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse issue and update CSV
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/process-rsvp-issue.mjs

      - name: Commit if changed
        if: steps.process.outcome == 'success'
        run: |
          if git diff --quiet -- katilimcilar.csv; then
            echo "No new entry (duplicate)."
            exit 0
          fi
          git config user.name  "rsvp-bot"
          git config user.email "rsvp-bot@users.noreply.github.com"
          git add katilimcilar.csv
          git commit -m "rsvp: append #${{ github.event.issue.number }}"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

      - name: Redact + close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.process.outcome }}' === 'success';
            const number = context.payload.issue.number;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              title: ok ? `rsvp #${number} (archived)` : `rsvp #${number} (invalid)`,
              body: ok
                ? 'Bu kayıt CSV\'ye eklendi ve kişisel veriler bu mesajdan temizlendi.'
                : 'Bu RSVP geçersiz bulundu ve işlenmedi.',
              state: 'closed',
              state_reason: ok ? 'completed' : 'not_planned',
              labels: ok ? ['rsvp', 'processed'] : ['rsvp', 'invalid'],
            });
