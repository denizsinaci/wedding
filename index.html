<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süheylanur & Deniz Nişanlanıyor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* --- Genel Ayarlar --- */
        :root {
            --bg-color: #edeec9; /* Dış arka plan */
            --card-bg: #fdf6e3; /* Kart rengi (Krem) */
            --text-dark: #3e2723; /* Koyu Kahve Yazılar */
            --text-gold: #b08d55; /* Altın Detaylar */
            --accent-red: #8b0000; /* Bordo Çiçek Rengi */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/paper.png'); /* Kağıt dokusu */
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Davetiye Kartı --- */
        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            border: 2px solid #e0d8c0;
            overflow: hidden;
        }

        /* Kenar Süslemesi (CSS ile Basit Çiçek Efekti) */
        .flower-decor {
            font-size: 2rem;
            color: var(--accent-red);
            margin-bottom: 10px;
        }

        /* --- Metin Stilleri --- */
        .intro {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .names {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--text-dark);
            margin: 20px 0;
            line-height: 1.3;
        }

        .ampersand {
            font-family: 'Great Vibes', cursive;
            color: var(--text-gold);
            font-size: 2rem;
            display: block;
            margin: 5px 0;
        }

        /* --- Tarih Bölümü --- */
        .date-box {
            border-top: 1px solid var(--text-gold);
            border-bottom: 1px solid var(--text-gold);
            padding: 20px 0;
            margin: 30px auto;
            width: 80%;
        }

        .month {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--text-dark);
        }

        .day-number {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--text-dark);
            line-height: 1;
            margin: 10px 0;
        }

        .year {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--text-dark);
        }

        .day-time {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-weight: 500;
            color: var(--accent-red);
        }

        /* --- Mekan Bölümü --- */
        .venue {
            margin-top: 30px;
        }

        .venue-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .address {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 20px;
        }

        /* --- Buton --- */
        .btn-map {
            display: inline-block;
            background-color: var(--text-dark);
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
            box-shadow: 0 4px 15px rgba(62, 39, 35, 0.3);
        }

        .btn-map:hover {
            background-color: var(--accent-red);
        }

        /* Süsleme (Yüzük ikonu) */
        .rings-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1));
        }

    </style>
</head>
<body>

    <div class="card">
        <div class="rings-icon">💍</div>

        <div class="intro">Nişanlanıyoruz...</div>

        <div class="names">
            Süheylanur
            <span class="ampersand">&</span>
            Deniz
        </div>

        <div class="date-box">
            <div class="month">ARALIK</div>
            <div class="day-number">27</div>
            <div class="year">2025</div>
            
            <div class="day-time">
                <span>CUMARTESİ</span>
                <span>|</span>
                <span>SAAT: 19.00</span>
            </div>
        </div>

        <div class="venue">
            <div class="venue-name">Arzucca Organizasyon & Davet</div>
            <div class="address">
                Cumhuriyet Mh. Yağmur Sk. No:10/B<br>
                Nilüfer / Bursa
            </div>

            <a href="https://www.google.com/maps/search/?api=1&query=Arzucca+Organizasyon+Davet+Nilüfer+Bursa" target="_blank" class="btn-map">
                Haritada Gör 📍
            </a>
        </div>
    </div>

</body>
</html>
